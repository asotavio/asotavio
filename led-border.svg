<svg width="900" height="190" viewBox="0 0 900 190"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Cor da linha -->
    <linearGradient id="led" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>

    <!-- Brilho -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Fundo -->
  <rect
    width="900"
    height="190"
    rx="18"
    fill="#0D1117"
  />

  <!-- Borda discreta -->
  <rect
    x="3"
    y="3"
    width="894"
    height="184"
    rx="16"
    fill="none"
    stroke="#21262D"
    stroke-width="2"
  />

  <!-- Linha LED -->
  <rect
    x="3"
    y="3"
    width="894"
    height="184"
    rx="16"
    fill="none"
    stroke="url(#led)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="1 1000"
    filter="url(#glow)"
  >

    <!-- A linha cresce até completar a borda -->
    <animate
      attributeName="stroke-dasharray"
      values="1 1000;150 850;300 700;500 500;700 300;900 100;1000 0"
      dur="4s"
      repeatCount="indefinite"
    />

    <!-- Depois percorre novamente -->
    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-1000"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>

  <!-- Nome -->
  <text
    x="450"
    y="92"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#FFFFFF"
  >
    Otávio
  </text>

  <!-- Subtítulo -->
  <text
    x="450"
    y="125"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    fill="#8B949E"
  >
    Software Engineering Student
  </text>

</svg>
