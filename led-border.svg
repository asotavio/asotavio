<svg width="900" height="240" viewBox="0 0 900 240"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="textGradient">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

  </defs>

  <!-- Fundo -->
  <rect
    width="900"
    height="240"
    rx="24"
    fill="#0D1117"
  />

  <!-- Borda base -->
  <rect
    x="4"
    y="4"
    width="892"
    height="232"
    rx="22"
    fill="none"
    stroke="#21262D"
    stroke-width="2"
  />

  <!-- Borda neon -->
  <rect
    x="4"
    y="4"
    width="892"
    height="232"
    rx="22"
    fill="none"
    stroke="url(#neon)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="120 700"
    filter="url(#glow)"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-820"
      dur="3s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Nome -->
  <text
    x="450"
    y="108"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    fill="url(#textGradient)"
  >
    Otávio
  </text>

  <!-- Subtítulo -->
  <text
    x="450"
    y="145"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    fill="#8B949E"
  >
    Software Engineering Student
  </text>

</svg>
