<svg width="900" height="190" viewBox="0 0 900 190"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Verde LED -->
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Vermelho LED -->
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Fundo -->
  <rect
    width="900"
    height="190"
    rx="18"
    fill="#0D1117"
  />

  <!-- Borda escura -->
  <rect
    x="3"
    y="3"
    width="894"
    height="184"
    rx="16"
    fill="none"
    stroke="#1F2933"
    stroke-width="2"
  />

  <!-- LINHA VERDE -->
  <rect
    x="3"
    y="3"
    width="894"
    height="184"
    rx="16"
    fill="none"
    stroke="#39FF88"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="0 1000"
    filter="url(#greenGlow)"
  >

    <!-- Cresce até o primeiro ponto -->
    <animate
      attributeName="stroke-dasharray"
      values="
        0 1000;
        180 820;
        360 640;
        540 460;
        720 280;
        900 100;
        1000 0;
        1000 0;
        1000 0;
        0 1000
      "
      dur="6s"
      repeatCount="indefinite"
    />

  </rect>

  <!-- QUADRADO VERMELHO -->
  <rect
    x="885"
    y="0"
    width="8"
    height="8"
    rx="1"
    fill="#FF3B3B"
    filter="url(#redGlow)"
  >

    <!-- Primeiro ponto -->
    <animate
      attributeName="x"
      values="885;450;3;450;885"
      dur="6s"
      repeatCount="indefinite"
    />

    <!-- Segundo eixo -->
    <animate
      attributeName="y"
      values="0;3;90;184;0"
      dur="6s"
      repeatCount="indefinite"
    />

  </rect>

  <!-- NOME -->
  <text
    x="450"
    y="94"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#FFFFFF"
  >
    Otávio
  </text>

  <!-- SUBTÍTULO -->
  <text
    x="450"
    y="127"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    fill="#8B949E"
  >
    Software Engineering Student
  </text>

</svg>
